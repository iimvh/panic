name: CI

# The gate: every push to master and every pull request must pass this before it counts.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with the z submodule)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui-v1/package-lock.json
            ui-v2/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Builds the UI into the web jar, compiles with -Werror, runs every Java test (ConventionsTest included).
      - name: Gradle check
        run: ./gradlew check --console=plain

      # node_modules was installed by the Gradle build (:web:installUi).
      - name: UI type check
        working-directory: ui-v1
        run: npm run check

      - name: UI tests
        working-directory: ui-v1
        run: npm test

      # ui-v2, beside ui-v1 until it becomes the default: types, unit and component tests, the size budget, and
      # end-to-end tests on the built app with a scripted fake API (no server, no keys).
      - name: UI v2 install
        working-directory: ui-v2
        run: npm ci --no-audit --no-fund

      - name: UI v2 type check and tests
        working-directory: ui-v2
        run: npm run check && npm test

      - name: UI v2 build and size budget
        working-directory: ui-v2
        run: npm run build && npm run budget

      - name: UI v2 end-to-end tests
        working-directory: ui-v2
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            ui-v2/playwright-report/
            ui-v2/test-results/
          retention-days: 7
