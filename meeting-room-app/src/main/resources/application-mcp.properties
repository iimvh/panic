# Profile "mcp": enables the MCP client and connects to meeting-room-mcp-demo.
# Start the demo server first: mvn -pl meeting-room-mcp-demo -am spring-boot:run (port 8081)
# Then run the app: SPRING_PROFILES_ACTIVE=mcp mvn -pl meeting-room-app -am spring-boot:run
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true

# Spring AI 1.0.0 + MCP SDK 0.10.0 support SSE (no streamable-http);
# meeting-room-mcp-demo serves SSE at /sse with the message endpoint /mcp/message.
spring.ai.mcp.client.sse.connections.room-catalog.url=${MCP_CATALOG_URL:http://localhost:8081}
