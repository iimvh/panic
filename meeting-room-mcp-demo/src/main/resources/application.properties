spring.application.name=meeting-room-mcp-demo
server.port=${MCP_SERVER_PORT:8081}

# SSE transport is the only server-side transport in Spring AI 1.0.0 / MCP SDK 0.10.0.
# The client (meeting-room-app, mcp profile) connects to http://localhost:8081/sse,
# message endpoint defaults to /mcp/message.
spring.ai.mcp.server.name=room-catalog
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

logging.level.io.modelcontextprotocol=INFO
logging.level.com.meetingroom.mcpdemo=INFO
