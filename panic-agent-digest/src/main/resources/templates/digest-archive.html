<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="${title}">Lưu trữ bản tin</title>
	<meta name="description" th:content="${description}" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<style th:replace="~{digest-style :: style}"></style>
</head>
<body>
	<header class="site-header">
		<a class="brand" href="/ban-tin">Bản tin mỗi sáng</a>
		<nav>
			<a href="/ban-tin/luu-tru">Lưu trữ</a>
			<a href="/">Trợ lý Panic</a>
		</nav>
	</header>

	<main class="digest">
		<h1 th:text="${title}">Lưu trữ bản tin</h1>
		<p class="intro">Xem lại bản tin của những ngày trước.</p>
		<ul class="archive">
			<li th:each="digest : ${digests}">
				<a th:href="'/ban-tin/' + ${digest.digestDate}"
					th:text="'Bản tin ngày ' + ${digest.digestDate} + ' (' + ${digest.itemCount} + ' tin)'"></a>
			</li>
		</ul>
		<p th:if="${#lists.isEmpty(digests)}">Chưa có bản tin nào trong kho.</p>
	</main>

	<footer class="site-footer">
		<p>Bản tin chỉ lưu tiêu đề, liên kết và trích đoạn ngắn; mọi nội dung thuộc về nguồn gốc.</p>
	</footer>
</body>
</html>
