<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="style">
	<style>
		:root { color-scheme: light; }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			line-height: 1.6;
			color: #1a1f2e;
			background: #fff;
		}
		.site-header {
			display: flex; align-items: center; justify-content: space-between;
			max-width: 720px; margin: 0 auto; padding: 16px 20px;
			border-bottom: 1px solid #e6e8ee;
		}
		.brand { font-weight: 700; text-decoration: none; color: #0d1322; }
		.site-header nav a { margin-left: 16px; color: #5b6478; text-decoration: none; font-size: 14px; }
		.digest { max-width: 720px; margin: 0 auto; padding: 24px 20px 64px; }
		h1 { font-size: 26px; line-height: 1.25; margin: 16px 0 12px; }
		.intro { font-size: 17px; color: #3a4257; margin: 0 0 16px; }
		.notice { background: #fff7e6; border: 1px solid #f0d9a8; padding: 10px 14px; border-radius: 6px; font-size: 14px; }
		.share { display: flex; gap: 12px; margin: 16px 0 28px; }
		.share a { font-size: 14px; color: #2563eb; text-decoration: none; }
		.topic { margin-bottom: 28px; }
		.topic h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; border-bottom: 1px solid #e6e8ee; padding-bottom: 8px; }
		.item { padding: 14px 0; border-bottom: 1px solid #f0f1f5; }
		.item h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.35; }
		.item h3 a { color: #0d1322; text-decoration: none; }
		.item h3 a:hover { text-decoration: underline; }
		.summary { margin: 0 0 6px; color: #3a4257; }
		.source { margin: 0; font-size: 13px; color: #6b7280; }
		.source a { color: #2563eb; text-decoration: none; }
		.related h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; }
		.related ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
		.related a { color: #2563eb; text-decoration: none; font-size: 14px; }
		.site-footer { max-width: 720px; margin: 0 auto; padding: 20px; border-top: 1px solid #e6e8ee; font-size: 13px; color: #6b7280; }
		.site-footer a { color: #2563eb; text-decoration: none; }
	</style>
</th:block>
</body>
</html>
