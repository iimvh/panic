# Store of record: Postgres (e.g. the Aiven instance), activated with --spring.profiles.active=postgres.
# Coordinates come from DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD in .env or the
# environment; the schema evolves through ddl-auto=update on first boot, like the H2 default.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
