spring.application.name=panic

# File-based H2 so conversation memory survives a restart (AUTO_SERVER allows a second connection).
spring.datasource.url=jdbc:h2:file:./data/panic;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Spring AI (OpenRouter via OpenAI-compatible client).
# Set OPENROUTER_API_KEY env var to enable the AI assistant.
# OpenRouter: Spring AI appends /v1/chat/completions itself, so base-url must NOT include /v1
spring.ai.openai.base-url=https://openrouter.ai/api
# OpenAiChatModel refuses to initialise with an empty key, so a placeholder is used: the app still starts
# (UI + /actuator/*) and agents report "OPENROUTER_API_KEY required" only when they actually call the LLM.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:missing-openrouter-api-key}
# Model id (LLM_MODEL in .env; must support tool/function calling)
spring.ai.openai.chat.options.model=${LLM_MODEL:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=4096

# OpenRouter requires a custom header for routing/attribution; set via env if desired.
spring.ai.openai.chat.headers.HTTP-Referer=${OPENROUTER_REFERER:}
spring.ai.openai.chat.headers.X-Title=${OPENROUTER_TITLE:panic}

# Agent plugins: agents are discovered from every agents/*/agent.yaml on the classpath, so
# installing an agent = adding its module dependency to panic-app/pom.xml.
# The coordinator is the root; agent modules may also be toggled here.
app.agents.root=coordinator
app.agents.coordinator.enabled=true
app.agents.echo.enabled=true

# MCP client stays off: the bundled agent has no MCP tools.
spring.ai.mcp.client.enabled=false

# Conversation memory: number of most recent turns replayed into the root agent prompt.
app.memory.window-turns=20

# Actuator
management.endpoints.web.exposure.include=health,info,agents
management.endpoint.health.show-details=always

server.port=8080
