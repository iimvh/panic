spring.application.name=panic

# File-based H2 so conversation memory survives a restart (AUTO_SERVER allows a second connection).
spring.datasource.url=jdbc:h2:file:./data/panic;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Spring AI (OpenRouter via OpenAI-compatible client).
# The provider connection (API key + model) is configured at runtime in the Settings
# panel and stored in llm_provider_config — there is NO environment-provided default.
# The placeholder key below only keeps the auto-configured OpenAI beans alive: the app
# still boots (UI + /actuator/*) and agents report "No LLM provider connected" until
# one is connected in the Settings panel. Spring AI appends /v1 itself, so base-url
# must NOT include /v1.
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=missing-openrouter-api-key

# Chat defaults applied to every provider call (never the model identity itself).
app.provider.chat-temperature=0.2
app.provider.chat-max-tokens=4096

# Agent plugins: agents are discovered from every agents/*/agent.yaml on the classpath, so
# installing an agent = adding its module dependency to panic-app/pom.xml.
# The coordinator is the root; agent modules may also be toggled here.
app.agents.root=coordinator
app.agents.coordinator.enabled=true
app.agents.echo.enabled=true

# MCP client stays off: the bundled agent has no MCP tools.
spring.ai.mcp.client.enabled=false

# Digest feature (morning news feed): toggled like any other agent plugin.
app.agents.digest.enabled=true
# Morning run: daily 05:30 Vietnam time; item count bounds the daily model cost.
app.digest.scheduling-enabled=true
app.digest.cron=0 30 5 * * *
app.digest.zone=Asia/Ho_Chi_Minh
app.digest.max-items=8
# Manual generation is operator-only; keep it off in production.
app.digest.manual-generation-enabled=false
# Public origin used for share links and the sitemap.
app.digest.public-base-url=${PANIC_PUBLIC_BASE_URL:http://localhost:8080}

# Conversation memory: number of most recent turns replayed into the root agent prompt.
app.memory.window-turns=20

# Conversation sessions: Redis accelerator (Upstash REST preferred, REDIS_URL as TCP-only fallback).
# Neither set => the workspace runs without hot cache, rate limit and conversation lock.
# Values come from .env / the environment; they are never committed.
app.redis.upstash-rest-url=${UPSTASH_REDIS_REST_URL:}
app.redis.upstash-rest-token=${UPSTASH_REDIS_REST_TOKEN:}
app.redis.url=${REDIS_URL:}
# Chat access guard: per-conversation chat quota, per-user session-creation quota, run-lock TTL.
app.chat.rate-limit-per-minute=20
app.chat.create-limit-per-minute=20
app.chat.lock-ttl-seconds=300
# TTL of the cached recent-turn window (panic:conv:{id}:window); reads refresh it.
app.conversation.window-cache-ttl-seconds=600

# The workspace ships its own fail-open degradation around Redis; skip Boot's redis health ping.
management.health.redis.enabled=false
# The accelerator uses only string commands — Redis repository scanning would misread the JPA repos.
spring.data.redis.repositories.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,agents
management.endpoint.health.show-details=always

server.port=8080
