# Test wiring: the coordinator is the only bundled agent.
app.agents.root=coordinator
# No real LLM calls in tests (the executor blocks when the key is the placeholder).
spring.ai.openai.api-key=missing-openrouter-api-key
spring.jpa.show-sql=false
spring.ai.mcp.client.enabled=false
# Tests use a throwaway in-memory DB, never the on-disk ./data file.
spring.datasource.url=jdbc:h2:mem:wiring;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
