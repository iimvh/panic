[package]
name = "panic-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal front-end for Panic: talks to the web plugin's JSON + SSE API"
license = "MIT"
publish = false

[[bin]]
name = "panic-tui"
path = "src/main.rs"

# Each dependency is written down with its reason in README.md (AGENTS.md rule 10).
[dependencies]
ratatui = "0.30"
ureq = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
